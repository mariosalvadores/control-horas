<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="favicon.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Control de Ingreso y Egreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-oscuro:#0E2A47;
    --azul-medio:#15436E;
    --azul-claro:#2E6DA4;
    --gris-claro:#F2F5F8;
    --gris-borde:#DCE3EA;
    --gris-texto:#5C6B7A;
    --blanco:#FFFFFF;
    --verde-ingreso:#1D7A55;
    --verde-ingreso-dark:#155C40;
    --rojo-egreso:#B3452F;
    --rojo-egreso-dark:#8F3524;
    --ambar:#B7791F;
    --gris-disabled-bg:#CDD5DC;
    --gris-disabled-txt:#7C8894;
    --radius-lg:18px;
    --radius-md:12px;
    --shadow:0 2px 10px rgba(14,42,71,0.08);
    --shadow-lg:0 8px 24px rgba(14,42,71,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--gris-claro);
    color:var(--azul-oscuro);
    min-height:100vh;
    padding-bottom:40px;
    -webkit-font-smoothing:antialiased;
  }

  .app{max-width:480px;margin:0 auto;padding:0 16px;}

  header.top{
    background:var(--azul-oscuro);
    color:var(--blanco);
    padding:22px 20px 26px;
    border-radius:0 0 24px 24px;
    margin-bottom:18px;
    box-shadow:var(--shadow-lg);
    position:relative;
  }
  header.top .eyebrow{
    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    color:#9DB4CC;font-weight:600;margin-bottom:6px;
  }
  header.top h1{margin:0 0 14px;font-size:20px;font-weight:700;}
  .clock{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;letter-spacing:1px;line-height:1;}
  .clock-date{font-size:13px;color:#B9CBDC;margin-top:6px;text-transform:capitalize;}

  .conn-badge{
    position:absolute;top:18px;right:18px;
    display:flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:999px;
    background:rgba(255,255,255,0.08);
    font-size:11px;font-weight:600;color:#E4ECF3;
  }
  .conn-dot{width:7px;height:7px;border-radius:50%;background:#3FCB8E;}
  .conn-badge.offline .conn-dot{background:#E0A93F;}
  .conn-badge.offline{color:#F3DFAF;}

  .status-row{
    display:flex;align-items:center;gap:8px;margin-top:16px;
    padding:10px 14px;background:rgba(255,255,255,0.08);
    border-radius:999px;width:fit-content;
  }
  .status-dot{width:9px;height:9px;border-radius:50%;background:#6C7E90;flex-shrink:0;}
  .status-dot.active{background:#3FCB8E;box-shadow:0 0 0 4px rgba(63,203,142,0.25);}
  .status-row span{font-size:13px;color:#E4ECF3;font-weight:500;}

  .estado-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:14px 16px;border-radius:var(--radius-md);margin-bottom:14px;
    border:2px solid transparent;transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .estado-box .estado-linea{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
  .estado-box .estado-emoji{font-size:18px;}
  .estado-box .estado-verificacion{font-size:11px;font-weight:600;opacity:0.85;}
  .estado-box.trabajando{background:#E7F4EE;color:var(--verde-ingreso-dark);border-color:var(--verde-ingreso);}
  .estado-box.fuera{background:#FBEAE6;color:var(--rojo-egreso-dark);border-color:var(--rojo-egreso);}
  .estado-box.cargando{background:#EEF2F6;color:var(--gris-texto);border-color:var(--gris-borde);}

  .punch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .punch-btn{
    border:none;border-radius:var(--radius-lg);padding:22px 12px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-family:inherit;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .2s ease, color .2s ease;
    box-shadow:var(--shadow);color:var(--blanco);
  }
  .punch-btn:active{transform:scale(0.96);}
  .punch-btn.ingreso{background:linear-gradient(160deg,var(--verde-ingreso),var(--verde-ingreso-dark));}
  .punch-btn.egreso{background:linear-gradient(160deg,var(--rojo-egreso),var(--rojo-egreso-dark));}
  .punch-btn:disabled{
    background:var(--gris-disabled-bg) !important;color:var(--gris-disabled-txt) !important;
    box-shadow:none;opacity:1;cursor:not-allowed;transform:none;pointer-events:none;
  }
  .punch-btn .icon{font-size:26px;line-height:1;}
  .punch-btn .label{font-size:15px;font-weight:700;letter-spacing:.3px;}
  .punch-btn .sub{font-size:11px;opacity:.85;font-weight:500;}

  .card{
    background:var(--blanco);border-radius:var(--radius-lg);padding:18px;
    box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--gris-borde);
  }
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .card h2{
    margin:0 0 4px;font-size:14px;font-weight:700;color:var(--azul-oscuro);
    text-transform:uppercase;letter-spacing:0.6px;
  }
  .card .card-sub{font-size:12px;color:var(--gris-texto);margin-bottom:6px;}
  .refresh-btn{
    background:var(--gris-claro);border:1px solid var(--gris-borde);
    color:var(--azul-medio);font-size:11px;font-weight:600;
    padding:6px 10px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;gap:5px;font-family:inherit;
  }
  .refresh-btn:hover{background:var(--gris-borde);}
  .refresh-btn.spinning .refresh-icon{animation:spin 0.8s linear infinite;}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

  .fuente-nube{
    font-size:10.5px;color:var(--gris-texto);margin-bottom:10px;
    display:flex;align-items:center;gap:5px;
  }
  .fuente-nube.ok{color:var(--verde-ingreso-dark);}
  .fuente-nube.error{color:var(--rojo-egreso-dark);}

  .conflict-banner{
    background:#FBEAE6;border:1px solid var(--rojo-egreso);color:var(--rojo-egreso-dark);
    font-size:12px;font-weight:600;padding:10px 12px;border-radius:10px;margin-bottom:12px;
  }

  /* SEMANAS (accordion) */
  .week-details{border:1px solid var(--gris-borde);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;}
  .week-details:last-child{margin-bottom:0;}
  .week-details summary{
    list-style:none;cursor:pointer;padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--gris-claro);font-weight:700;font-size:13px;color:var(--azul-oscuro);
  }
  .week-details summary::-webkit-details-marker{display:none;}
  .week-details[open] summary{border-bottom:1px solid var(--gris-borde);}
  .week-summary-left{display:flex;flex-direction:column;gap:2px;}
  .week-summary-left .week-tag{font-size:10px;color:var(--azul-claro);text-transform:uppercase;letter-spacing:.4px;}
  .week-total-badge{
    font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;
    color:var(--verde-ingreso-dark);background:#E7F4EE;padding:4px 10px;border-radius:8px;white-space:nowrap;
  }
  .week-sessions{padding:6px 14px 4px;}

  .summary-main{display:flex;align-items:baseline;gap:8px;margin:10px 0 14px;}
  .summary-main .big{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;color:var(--azul-oscuro);}
  .summary-main .unit{font-size:13px;color:var(--gris-texto);font-weight:600;}

  .history-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--gris-borde);gap:10px;
  }
  .history-item:last-child{border-bottom:none;}
  .hist-left{display:flex;flex-direction:column;gap:2px;}
  .hist-day{font-size:13px;font-weight:700;color:var(--azul-oscuro);text-transform:capitalize;}
  .hist-date{font-size:11px;color:var(--gris-texto);}
  .hist-times{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--azul-medio);
    display:flex;gap:6px;align-items:center;
  }
  .hist-times .sep{color:var(--gris-texto);}
  .hist-times .pending{color:var(--rojo-egreso);font-style:italic;font-family:'Inter',sans-serif;font-size:11.5px;}
  .hist-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .hist-hours{
    font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;
    color:var(--verde-ingreso-dark);background:#E7F4EE;padding:4px 9px;border-radius:8px;white-space:nowrap;
  }
  .sync-tag{font-size:10px;font-weight:600;display:flex;align-items:center;gap:3px;}
  .sync-tag.synced{color:var(--verde-ingreso-dark);}
  .sync-tag.pending{color:var(--ambar);}

  .empty-state{text-align:center;padding:28px 10px;color:var(--gris-texto);font-size:13px;}
  .empty-state .icon{font-size:28px;display:block;margin-bottom:8px;}
  .skeleton{padding:18px 0;text-align:center;color:var(--gris-texto);font-size:13px;}

  .footer-actions{
    text-align:center;margin-top:8px;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .footer-actions button{
    background:none;border:none;color:var(--gris-texto);font-size:12px;
    text-decoration:underline;cursor:pointer;font-family:inherit;
  }
  .footer-actions button:hover{color:var(--rojo-egreso);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--azul-oscuro);color:var(--blanco);padding:12px 20px;border-radius:999px;
    font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;
    transition:opacity .25s ease, transform .25s ease;pointer-events:none;z-index:100;
    max-width:90vw;text-align:center;display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{background:var(--verde-ingreso-dark);}
  .toast.warning{background:var(--ambar);}
  .toast.error{background:var(--rojo-egreso-dark);}

  @media (max-width:360px){
    .clock{font-size:28px;}
    .summary-main .big{font-size:28px;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="conn-badge" id="connBadge">
      <span class="conn-dot"></span>
      <span id="connText">En línea</span>
    </div>
    <div class="eyebrow">Control de asistencia</div>
    <h1>Ingreso y Egreso</h1>
    <div class="clock" id="clock">00:00:00</div>
    <div class="clock-date" id="clockDate">-</div>
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Sin marcas registradas</span>
    </div>
  </header>

  <div class="estado-box cargando" id="estadoBox">
    <div class="estado-linea">
      <span class="estado-emoji" id="estadoEmoji">⏳</span>
      <span id="estadoTexto">Verificando estado con el servidor...</span>
    </div>
    <div class="estado-verificacion" id="estadoVerificacion">Consultando...</div>
  </div>

  <div class="punch-grid">
    <button class="punch-btn ingreso" id="btnIngreso" disabled>
      <span class="icon">&#8594;</span>
      <span class="label">INGRESO</span>
      <span class="sub" id="subIngreso">Verificando...</span>
    </button>
    <button class="punch-btn egreso" id="btnEgreso" disabled>
      <span class="icon">&#8592;</span>
      <span class="label">EGRESO</span>
      <span class="sub" id="subEgreso">Verificando...</span>
    </button>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Historial por semana</h2>
      <button class="refresh-btn" id="btnRefreshHist"><span class="refresh-icon">&#8635;</span>Actualizar</button>
    </div>
    <div class="card-sub">Datos leídos directamente desde Google Sheets — iguales en todos los dispositivos</div>
    <div class="fuente-nube" id="fuenteNube">Cargando historial de la nube...</div>
    <div id="conflictBanner"></div>
    <div id="weeksContainer">
      <div class="skeleton">Cargando semanas...</div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="sync-btn" id="btnForceSync">Reintentar sincronización pendiente</button>
    <button id="btnReset">Borrar marcas locales pendientes de este dispositivo</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "control_ingreso_egreso_marcas_v3";
  // URL de tu Google Apps Script (Web App) — con doPost validado y doGet (estado + historial)
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxolC6hn6Omu45duFQMK7aLCjaBKVSH1Kr8dFyd849wXrjrOE0fVkwtochQJBxohPcP0w/exec";
  const POLL_ESTADO_MS = 20000;    // sondeo liviano de estado (botones)
  const POLL_HISTORIAL_MS = 60000; // sondeo del historial completo (semanas)

  const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

  // ---------- Storage local (solo respaldo de lo que este dispositivo generó) ----------
  function loadMarcas(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ console.error("Error leyendo localStorage", e); return []; }
  }
  function saveMarcas(marcas){ localStorage.setItem(STORAGE_KEY, JSON.stringify(marcas)); }

  let marcas = loadMarcas(); // marcas propias de este dispositivo (con estado de sync)

  // Estado / datos autoritativos que vienen del servidor (Google Sheets)
  let ultimoEstadoServidor = null;   // { tipo, timestamp, ... } | null   (sondeo liviano)
  let servidorVerificado = false;
  let ultimaVerificacionTs = null;
  let botonesCargando = false;

  let historialServidor = [];        // array completo de marcas leídas de la hoja
  let historialCargado = false;
  let historialError = false;
  let actualizandoHistorial = false;

  // ---------- Time helpers ----------
  function roundToNearest15(date){
    const d = new Date(date.getTime());
    const minutes = d.getMinutes();
    const remainder = minutes % 15;
    let roundedMinutes = (remainder < 7.5) ? (minutes - remainder) : (minutes + (15 - remainder));
    d.setMinutes(roundedMinutes); d.setSeconds(0); d.setMilliseconds(0);
    return d;
  }
  function fmtTime(date){
    if(!date) return "--:--";
    const d = new Date(date);
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }
  function fmtTimeSec(date){
    const d = new Date(date);
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
  }
  function fmtDateShort(date){
    const d = new Date(date);
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function dateOnlyISO(date){
    const d = new Date(date); d.setHours(0,0,0,0);
    return d.toISOString().slice(0,10);
  }
  function hoursDecimal(entradaMs, salidaMs){
    if(!entradaMs || !salidaMs) return 0;
    const diff = salidaMs - entradaMs;
    return diff > 0 ? diff / (1000*60*60) : 0;
  }
  function fmtHoursMin(decimalHours){
    const totalMinutes = Math.round(decimalHours * 60);
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    return `${h}:${String(m).padStart(2,"0")}`;
  }
  function getWeekRange(date){
    const d = new Date(date); d.setHours(0,0,0,0);
    const day = d.getDay();
    const diffToMonday = (day === 0) ? -6 : 1 - day;
    const monday = new Date(d); monday.setDate(d.getDate() + diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
    return { start: monday, end: sunday };
  }

  function getMarcasLocalesOrdenadas(){
    return [...marcas].sort((a,b) => new Date(a.raw) - new Date(b.raw));
  }
  function getUltimaMarcaLocal(){
    const o = getMarcasLocalesOrdenadas();
    return o.length ? o[o.length - 1] : null;
  }

  // Combina lo que ya está confirmado en la hoja (historialServidor) con marcas
  // propias de este dispositivo que TODAVÍA no llegaron a sincronizarse, para no
  // perder de vista la acción más reciente aunque el servidor no la sepa todavía.
  function getMarcasCombinadas(){
    const idsServidor = new Set(historialServidor.map(m => m.id));
    const serverNorm = historialServidor.map(m => ({
      id: m.id, tipo: m.tipo, raw: m.timestamp,
      rounded: m.timestampRedondeado || `${m.fecha}T${m.horaRedondeada}:00`,
      synced: true, origen: "servidor"
    }));
    const localPendientes = marcas
      .filter(m => m.synced === false && !idsServidor.has(m.id))
      .map(m => ({ ...m, origen: "local" }));
    return [...serverNorm, ...localPendientes].sort((a,b) => new Date(a.raw) - new Date(b.raw));
  }

  function getUltimaMarcaEfectiva(){
    const combinadas = getMarcasCombinadas();
    return combinadas.length ? combinadas[combinadas.length - 1] : null;
  }

  function getEstadoActual(){
    // Prioriza el sondeo liviano de estado (más frecuente); si hay una marca local
    // pendiente más nueva que ese sondeo, esa manda (por si el sondeo aún no la vio).
    const candidatos = [];
    if(ultimoEstadoServidor && ultimoEstadoServidor.tipo){
      candidatos.push({ tipo: ultimoEstadoServidor.tipo, ts: new Date(ultimoEstadoServidor.timestamp || 0).getTime() });
    }
    const localUltima = getUltimaMarcaLocal();
    if(localUltima && localUltima.synced === false){
      candidatos.push({ tipo: localUltima.tipo, ts: new Date(localUltima.raw).getTime() });
    }
    if(candidatos.length === 0) return "fuera";
    candidatos.sort((a,b) => b.ts - a.ts);
    return candidatos[0].tipo === "Egreso" ? "fuera" : "trabajando";
  }

  // Reconstruye sesiones (entrada+salida) emparejando Ingreso→Egreso en orden cronológico.
  function buildSesiones(marcasOrdenadas){
    const sesiones = [];
    let abierta = null;
    marcasOrdenadas.forEach(m => {
      if(m.tipo === "Ingreso"){
        if(abierta) sesiones.push(abierta);
        abierta = {
          id: m.id, dateISO: dateOnlyISO(m.raw),
          entradaRaw: m.raw, entradaRounded: m.rounded, entradaSynced: m.synced,
          salidaRaw: null, salidaRounded: null, salidaSynced: null
        };
      } else {
        if(abierta){
          abierta.salidaRaw = m.raw; abierta.salidaRounded = m.rounded; abierta.salidaSynced = m.synced;
          sesiones.push(abierta); abierta = null;
        } else {
          sesiones.push({
            id: m.id, dateISO: dateOnlyISO(m.raw),
            entradaRaw: null, entradaRounded: null, entradaSynced: null,
            salidaRaw: m.raw, salidaRounded: m.rounded, salidaSynced: m.synced
          });
        }
      }
    });
    if(abierta) sesiones.push(abierta);
    return sesiones;
  }

  // Agrupa las sesiones en semanas lunes-domingo y calcula el total de horas de cada una.
  function buildGruposSemanales(sesiones){
    const grupos = {};
    sesiones.forEach(s => {
      const ref = s.entradaRaw || s.salidaRaw;
      if(!ref) return;
      const { start, end } = getWeekRange(new Date(ref));
      const key = dateOnlyISO(start);
      if(!grupos[key]) grupos[key] = { start, end, sesiones: [], totalHoras: 0 };
      grupos[key].sesiones.push(s);
      if(s.entradaRounded && s.salidaRounded){
        grupos[key].totalHoras += hoursDecimal(new Date(s.entradaRounded).getTime(), new Date(s.salidaRounded).getTime());
      }
    });
    return Object.values(grupos).sort((a,b) => b.start - a.start);
  }

  // ---------- Comunicación con Apps Script ----------
  async function enviarMarcaAlServidor(marca){
    const payload = {
      id: marca.id,
      timestamp: marca.raw,
      fecha: dateOnlyISO(marca.raw),
      tipo: marca.tipo,
      horaOriginal: fmtTimeSec(marca.raw),
      horaRedondeada: fmtTime(marca.rounded),
      timestampRedondeado: marca.rounded
    };
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function consultarEstadoServidor(){
    const res = await fetch(`${GAS_URL}?action=estado&_=${Date.now()}`, { method:"GET", cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function consultarHistorialServidor(){
    const res = await fetch(`${GAS_URL}?action=historial&_=${Date.now()}`, { method:"GET", cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json(); // array
  }

  async function actualizarEstadoDesdeServidor(silencioso){
    try{
      const data = await consultarEstadoServidor();
      ultimoEstadoServidor = data && data.tipo ? data : null;
      servidorVerificado = true;
      ultimaVerificacionTs = new Date();
      render();
    }catch(err){
      console.warn("No se pudo verificar el estado en el servidor:", err);
      servidorVerificado = false;
      render();
      if(!silencioso) showToast("No se pudo verificar el estado con el servidor.", "warning");
    }
  }

  async function actualizarHistorialDesdeServidor(silencioso){
    actualizandoHistorial = true;
    render();
    try{
      const data = await consultarHistorialServidor();
      historialServidor = Array.isArray(data) ? data : [];
      historialCargado = true;
      historialError = false;
    }catch(err){
      console.warn("No se pudo cargar el historial desde el servidor:", err);
      historialError = true;
      if(!silencioso) showToast("No se pudo cargar el historial desde Google Sheets.", "warning");
    }finally{
      actualizandoHistorial = false;
      render();
    }
  }

  async function reintentarPendientes(silencioso){
    if(!navigator.onLine) return;
    const pendientes = marcas.filter(m => m.synced === false);
    if(pendientes.length === 0){
      if(!silencioso) showToast("No hay registros pendientes de sincronizar.", "success");
      return;
    }
    if(!silencioso) showToast(`Sincronizando ${pendientes.length} registro(s) pendiente(s)...`, "warning");
    let huboExito = false;
    for(const m of pendientes){
      try{
        const resp = await enviarMarcaAlServidor(m);
        if(resp && resp.status === "ok"){ m.synced = true; huboExito = true; }
        else if(resp && resp.status === "rejected"){
          m.synced = "conflict";
          ultimoEstadoServidor = resp.ultimoEstado || ultimoEstadoServidor;
          servidorVerificado = true;
        }
      }catch(err){ console.warn("Reintento fallido para marca", m.id, err); }
    }
    saveMarcas(marcas);
    if(huboExito) await actualizarHistorialDesdeServidor(true);
    render();
  }

  // ---------- Acciones de marcado (validadas por el servidor) ----------
  function setBotonesCargando(loading){ botonesCargando = loading; render(); }

  async function marcarIngreso(){
    if(botonesCargando) return;
    if(getEstadoActual() !== "fuera"){ showToast("Ya estás marcado como Trabajando.", "warning"); return; }
    await ejecutarMarca("Ingreso");
  }
  async function marcarEgreso(){
    if(botonesCargando) return;
    if(getEstadoActual() !== "trabajando"){ showToast("No hay un Ingreso activo para marcar egreso.", "warning"); return; }
    await ejecutarMarca("Egreso");
  }

  async function ejecutarMarca(tipo){
    const now = new Date();
    const rounded = roundToNearest15(now);
    const marcaTentativa = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      tipo, raw: now.toISOString(), rounded: rounded.toISOString(), synced: false
    };

    if(!navigator.onLine){
      marcas.push(marcaTentativa); saveMarcas(marcas); render();
      showToast(`${tipo} guardado localmente. Sin conexión: se validará y sincronizará luego.`, "warning");
      return;
    }

    setBotonesCargando(true);
    try{
      const resp = await enviarMarcaAlServidor(marcaTentativa);

      if(resp && resp.status === "ok"){
        marcaTentativa.synced = true;
        marcas.push(marcaTentativa); saveMarcas(marcas);
        ultimoEstadoServidor = {
          tipo, timestamp: marcaTentativa.raw, fecha: dateOnlyISO(marcaTentativa.raw),
          horaOriginal: fmtTimeSec(marcaTentativa.raw), horaRedondeada: fmtTime(marcaTentativa.rounded)
        };
        servidorVerificado = true; ultimaVerificacionTs = new Date();
        setBotonesCargando(false);
        showToast(`${tipo} registrado y sincronizado con la nube ☁️`, "success");
        actualizarHistorialDesdeServidor(true);

      } else if(resp && resp.status === "rejected"){
        ultimoEstadoServidor = resp.ultimoEstado || ultimoEstadoServidor;
        servidorVerificado = true; ultimaVerificacionTs = new Date();
        setBotonesCargando(false);
        const tipoServidor = resp.ultimoEstado ? resp.ultimoEstado.tipo : null;
        showToast(
          tipoServidor === "Ingreso"
            ? "Ya existe un Ingreso activo registrado desde otro dispositivo."
            : "No hay un Ingreso activo según el servidor. No se registró el Egreso.",
          "error"
        );
        actualizarHistorialDesdeServidor(true);
      } else {
        throw new Error("Respuesta inesperada del servidor");
      }
    }catch(err){
      console.error("Fallo al validar con el servidor:", err);
      marcas.push(marcaTentativa); saveMarcas(marcas);
      setBotonesCargando(false);
      showToast(`${tipo} guardado localmente. No se pudo confirmar con el servidor; se reintentará.`, "warning");
    }
  }

  function resetAll(){
    if(!confirm("¿Borrar las marcas pendientes/locales de este dispositivo? Esto no afecta lo ya guardado en Google Sheets.")) return;
    marcas = marcas.filter(m => m.synced === true); // conserva solo las ya confirmadas, por prolijidad
    marcas = [];
    saveMarcas(marcas); render();
    showToast("Marcas locales pendientes eliminadas", "success");
  }

  // ---------- Rendering ----------
  function renderConnBadge(){
    const badge = document.getElementById("connBadge");
    const text = document.getElementById("connText");
    if(navigator.onLine){ badge.classList.remove("offline"); text.textContent = "En línea"; }
    else { badge.classList.add("offline"); text.textContent = "Sin conexión"; }
  }

  function renderEstadoBox(){
    const box = document.getElementById("estadoBox");
    const emoji = document.getElementById("estadoEmoji");
    const texto = document.getElementById("estadoTexto");
    const verif = document.getElementById("estadoVerificacion");

    if(botonesCargando){
      box.className = "estado-box cargando";
      emoji.textContent = "⏳"; texto.textContent = "Verificando con el servidor...";
      verif.textContent = "Confirmando con Google Sheets";
      return;
    }

    const estado = getEstadoActual();
    if(estado === "trabajando"){
      box.className = "estado-box trabajando"; emoji.textContent = "🟢";
      texto.textContent = "Estado actual: Trabajando";
    } else {
      box.className = "estado-box fuera"; emoji.textContent = "🔴";
      texto.textContent = "Estado actual: Fuera del trabajo";
    }

    if(servidorVerificado){
      const seg = ultimaVerificacionTs ? Math.max(0, Math.round((Date.now() - ultimaVerificacionTs.getTime())/1000)) : null;
      verif.textContent = seg !== null ? `✔ Verificado con el servidor (hace ${seg}s)` : "✔ Verificado con el servidor";
    } else {
      verif.textContent = "⚠ Sin verificar con el servidor — usando último dato conocido";
    }
  }

  function renderBotones(){
    const estado = getEstadoActual();
    const btnIngreso = document.getElementById("btnIngreso");
    const btnEgreso = document.getElementById("btnEgreso");
    const subIngreso = document.getElementById("subIngreso");
    const subEgreso = document.getElementById("subEgreso");

    if(botonesCargando){
      btnIngreso.disabled = true; btnEgreso.disabled = true;
      subIngreso.textContent = "Verificando..."; subEgreso.textContent = "Verificando...";
      return;
    }
    if(estado === "fuera"){
      btnIngreso.disabled = false; btnEgreso.disabled = true;
      subIngreso.textContent = "Marcar entrada"; subEgreso.textContent = "Bloqueado";
    } else {
      btnIngreso.disabled = true; btnEgreso.disabled = false;
      subIngreso.textContent = "Bloqueado"; subEgreso.textContent = "Marcar salida";
    }
  }

  function renderStatusRow(){
    const efectiva = getUltimaMarcaEfectiva();
    const dot = document.getElementById("statusDot");
    const text = document.getElementById("statusText");
    if(!efectiva){ dot.classList.remove("active"); text.textContent = "Sin marcas registradas"; return; }
    if(efectiva.tipo === "Ingreso"){
      dot.classList.add("active");
      text.textContent = `Ingreso activo desde las ${fmtTime(efectiva.rounded)}`;
    } else {
      dot.classList.remove("active");
      text.textContent = `Última salida: ${fmtTime(efectiva.rounded)}`;
    }
  }

  function renderFuenteNube(){
    const el = document.getElementById("fuenteNube");
    if(actualizandoHistorial){ el.className = "fuente-nube"; el.textContent = "🔄 Actualizando historial desde la nube..."; return; }
    if(historialError && !historialCargado){ el.className = "fuente-nube error"; el.textContent = "⚠ No se pudo cargar el historial desde Google Sheets."; return; }
    if(historialCargado){ el.className = "fuente-nube ok"; el.textContent = `☁️ Historial actualizado desde Google Sheets (${historialServidor.length} marcas)`; return; }
    el.className = "fuente-nube"; el.textContent = "Cargando historial de la nube...";
  }

  function renderConflictBanner(){
    const cont = document.getElementById("conflictBanner");
    const conflictos = marcas.filter(m => m.synced === "conflict");
    if(conflictos.length === 0){ cont.innerHTML = ""; return; }
    cont.innerHTML = `<div class="conflict-banner">⚠ ${conflictos.length} marca(s) de este dispositivo no se pudieron guardar porque ya existía una marca en conflicto registrada desde otro lugar. Revisá el estado actual antes de reintentar.</div>`;
  }

  function renderWeeks(){
    const container = document.getElementById("weeksContainer");

    if(!historialCargado && actualizandoHistorial){
      container.innerHTML = `<div class="skeleton">Cargando semanas...</div>`;
      return;
    }
    if(!historialCargado && historialError){
      container.innerHTML = `<div class="empty-state"><span class="icon">📡</span>No se pudo conectar con la hoja de cálculo.<br>Probá "Actualizar" cuando tengas conexión.</div>`;
      return;
    }

    const combinadas = getMarcasCombinadas();
    const sesiones = buildSesiones(combinadas);
    const grupos = buildGruposSemanales(sesiones);

    if(grupos.length === 0){
      container.innerHTML = `<div class="empty-state"><span class="icon">&#128203;</span>Todavía no hay marcas registradas.<br>Marcá tu ingreso para comenzar.</div>`;
      return;
    }

    const { start: inicioSemanaActual } = getWeekRange(new Date());
    const keyActual = dateOnlyISO(inicioSemanaActual);

    container.innerHTML = "";
    grupos.forEach(g => {
      const key = dateOnlyISO(g.start);
      const esActual = key === keyActual;

      const details = document.createElement("details");
      details.className = "week-details";
      if(esActual) details.open = true;

      const summary = document.createElement("summary");
      summary.innerHTML = `
        <span class="week-summary-left">
          <span>${fmtDateShort(g.start)} — ${fmtDateShort(g.end)}</span>
          <span class="week-tag">${esActual ? "Semana actual" : "Semana anterior"}</span>
        </span>
        <span class="week-total-badge">${fmtHoursMin(g.totalHoras)} h</span>
      `;
      details.appendChild(summary);

      const sesionesDiv = document.createElement("div");
      sesionesDiv.className = "week-sessions";

      const sesionesOrdenadas = [...g.sesiones].sort((a,b) =>
        new Date(b.entradaRaw || b.salidaRaw) - new Date(a.entradaRaw || a.salidaRaw)
      );

      sesionesOrdenadas.forEach(s => {
        const ref = s.entradaRaw || s.salidaRaw;
        const refDate = new Date(ref);
        const dayName = DIAS[refDate.getDay()];

        const entradaHtml = s.entradaRounded ? `<span>${fmtTime(s.entradaRounded)}</span>` : `<span class="pending">sin ingreso</span>`;
        const salidaHtml = s.salidaRounded ? `<span>${fmtTime(s.salidaRounded)}</span>` : `<span class="pending">en curso</span>`;
        const horasHtml = (s.entradaRounded && s.salidaRounded)
          ? fmtHoursMin(hoursDecimal(new Date(s.entradaRounded).getTime(), new Date(s.salidaRounded).getTime()))
          : "—";

        const entradaPendiente = s.entradaRounded ? s.entradaSynced === false : false;
        const salidaPendiente = s.salidaRounded ? s.salidaSynced === false : false;
        const syncHtml = (entradaPendiente || salidaPendiente)
          ? `<span class="sync-tag pending">⏳ Pendiente</span>`
          : `<span class="sync-tag synced">☁️ Nube</span>`;

        const item = document.createElement("div");
        item.className = "history-item";
        item.innerHTML = `
          <div class="hist-left">
            <span class="hist-day">${dayName}</span>
            <span class="hist-date">${fmtDateShort(refDate)}</span>
            <span class="hist-times">${entradaHtml}<span class="sep">→</span>${salidaHtml}</span>
          </div>
          <div class="hist-right">
            <div class="hist-hours">${horasHtml}</div>
            ${syncHtml}
          </div>
        `;
        sesionesDiv.appendChild(item);
      });

      details.appendChild(sesionesDiv);
      container.appendChild(details);
    });
  }

  function render(){
    renderConnBadge();
    renderEstadoBox();
    renderBotones();
    renderStatusRow();
    renderFuenteNube();
    renderConflictBanner();
    renderWeeks();

    const btn = document.getElementById("btnRefreshHist");
    if(actualizandoHistorial) btn.classList.add("spinning"); else btn.classList.remove("spinning");
  }

  function tickClock(){
    const now = new Date();
    document.getElementById("clock").textContent =
      `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
    const dayName = DIAS[now.getDay()];
    document.getElementById("clockDate").textContent = `${dayName}, ${now.getDate()} de ${now.toLocaleString('es-ES', { month: 'long' })}`;
  }

  let toastTimer = null;
  function showToast(msg, type){
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.className = "toast show" + (type ? (" " + type) : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
  }

  // ---------- Init ----------
  document.getElementById("btnIngreso").addEventListener("click", marcarIngreso);
  document.getElementById("btnEgreso").addEventListener("click", marcarEgreso);
  document.getElementById("btnReset").addEventListener("click", resetAll);
  document.getElementById("btnForceSync").addEventListener("click", () => reintentarPendientes(false));
  document.getElementById("btnRefreshHist").addEventListener("click", () => actualizarHistorialDesdeServidor(false));

  window.addEventListener("online", () => {
    render();
    showToast("Conexión recuperada. Verificando estado real...", "warning");
    actualizarEstadoDesdeServidor(true).then(() => reintentarPendientes(true));
    actualizarHistorialDesdeServidor(true);
  });
  window.addEventListener("offline", () => {
    render();
    showToast("Sin conexión a internet. No se puede verificar el estado con otros dispositivos.", "warning");
  });

  tickClock();
  setInterval(tickClock, 1000);
  render();

  actualizarEstadoDesdeServidor(true).then(() => reintentarPendientes(true));
  actualizarHistorialDesdeServidor(true);

  setInterval(() => actualizarEstadoDesdeServidor(true), POLL_ESTADO_MS);
  setInterval(() => actualizarHistorialDesdeServidor(true), POLL_HISTORIAL_MS);
  setInterval(() => { render(); }, 60000);

})();
</script>
</body>
