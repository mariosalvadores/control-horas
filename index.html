<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Control de Ingreso y Egreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-oscuro:#0E2A47;
    --azul-medio:#15436E;
    --azul-claro:#2E6DA4;
    --gris-claro:#F2F5F8;
    --gris-borde:#DCE3EA;
    --gris-texto:#5C6B7A;
    --blanco:#FFFFFF;
    --verde-ingreso:#1D7A55;
    --verde-ingreso-dark:#155C40;
    --rojo-egreso:#B3452F;
    --rojo-egreso-dark:#8F3524;
    --ambar:#B7791F;
    --gris-disabled-bg:#CDD5DC;
    --gris-disabled-txt:#7C8894;
    --radius-lg:18px;
    --radius-md:12px;
    --shadow:0 2px 10px rgba(14,42,71,0.08);
    --shadow-lg:0 8px 24px rgba(14,42,71,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--gris-claro);
    color:var(--azul-oscuro);
    min-height:100vh;
    padding-bottom:40px;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:480px;
    margin:0 auto;
    padding:0 16px;
  }

  /* HEADER */
  header.top{
    background:var(--azul-oscuro);
    color:var(--blanco);
    padding:22px 20px 26px;
    border-radius:0 0 24px 24px;
    margin-bottom:18px;
    box-shadow:var(--shadow-lg);
    position:relative;
  }
  header.top .eyebrow{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#9DB4CC;
    font-weight:600;
    margin-bottom:6px;
  }
  header.top h1{
    margin:0 0 14px;
    font-size:20px;
    font-weight:700;
  }
  .clock{
    font-family:'JetBrains Mono',monospace;
    font-size:34px;
    font-weight:700;
    letter-spacing:1px;
    line-height:1;
  }
  .clock-date{
    font-size:13px;
    color:#B9CBDC;
    margin-top:6px;
    text-transform:capitalize;
  }

  /* CONNECTION BADGE */
  .conn-badge{
    position:absolute;
    top:18px;
    right:18px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 11px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    font-size:11px;
    font-weight:600;
    color:#E4ECF3;
  }
  .conn-dot{
    width:7px;height:7px;border-radius:50%;
    background:#3FCB8E;
  }
  .conn-badge.offline .conn-dot{background:#E0A93F;}
  .conn-badge.offline{color:#F3DFAF;}

  /* STATUS PILL (dentro del header) */
  .status-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:16px;
    padding:10px 14px;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    width:fit-content;
  }
  .status-dot{
    width:9px;height:9px;border-radius:50%;
    background:#6C7E90;
    flex-shrink:0;
  }
  .status-dot.active{
    background:#3FCB8E;
    box-shadow:0 0 0 4px rgba(63,203,142,0.25);
  }
  .status-row span{font-size:13px;color:#E4ECF3;font-weight:500;}

  /* INDICADOR DE ESTADO ACTUAL (grande, arriba de los botones) */
  .estado-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:14px 16px;
    border-radius:var(--radius-md);
    font-weight:700;
    font-size:15px;
    margin-bottom:14px;
    border:2px solid transparent;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .estado-box .estado-emoji{font-size:18px;}
  .estado-box.trabajando{
    background:#E7F4EE;
    color:var(--verde-ingreso-dark);
    border-color:var(--verde-ingreso);
  }
  .estado-box.fuera{
    background:#FBEAE6;
    color:var(--rojo-egreso-dark);
    border-color:var(--rojo-egreso);
  }

  /* MAIN BUTTONS */
  .punch-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  .punch-btn{
    border:none;
    border-radius:var(--radius-lg);
    padding:22px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-family:inherit;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .2s ease, color .2s ease;
    box-shadow:var(--shadow);
    color:var(--blanco);
  }
  .punch-btn:active{transform:scale(0.96);}
  .punch-btn.ingreso{
    background:linear-gradient(160deg,var(--verde-ingreso),var(--verde-ingreso-dark));
  }
  .punch-btn.egreso{
    background:linear-gradient(160deg,var(--rojo-egreso),var(--rojo-egreso-dark));
  }
  /* El estado "disabled" siempre gana: botón gris plano, sin sombra, sin click */
  .punch-btn:disabled{
    background:var(--gris-disabled-bg) !important;
    color:var(--gris-disabled-txt) !important;
    box-shadow:none;
    opacity:1;
    cursor:not-allowed;
    transform:none;
    pointer-events:none;
  }
  .punch-btn .icon{font-size:26px;line-height:1;}
  .punch-btn .label{font-size:15px;font-weight:700;letter-spacing:.3px;}
  .punch-btn .sub{font-size:11px;opacity:.85;font-weight:500;}

  /* CARDS */
  .card{
    background:var(--blanco);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
    border:1px solid var(--gris-borde);
  }
  .card h2{
    margin:0 0 4px;
    font-size:14px;
    font-weight:700;
    color:var(--azul-oscuro);
    text-transform:uppercase;
    letter-spacing:0.6px;
  }
  .card .card-sub{
    font-size:12px;
    color:var(--gris-texto);
    margin-bottom:14px;
  }

  /* WEEKLY SUMMARY */
  .summary-main{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:14px;
  }
  .summary-main .big{
    font-family:'JetBrains Mono',monospace;
    font-size:38px;
    font-weight:700;
    color:var(--azul-oscuro);
  }
  .summary-main .unit{
    font-size:14px;
    color:var(--gris-texto);
    font-weight:600;
  }
  .week-bars{
    display:flex;
    gap:6px;
    align-items:flex-end;
    height:64px;
    padding-top:6px;
    border-top:1px solid var(--gris-borde);
  }
  .day-bar-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    gap:6px;
  }
  .day-bar{
    width:100%;
    max-width:22px;
    background:var(--gris-borde);
    border-radius:5px 5px 2px 2px;
    min-height:4px;
    transition:height .3s ease;
  }
  .day-bar.has-hours{background:var(--azul-claro);}
  .day-bar.today{background:var(--azul-oscuro);}
  .day-label{
    font-size:10px;
    color:var(--gris-texto);
    font-weight:600;
    text-transform:uppercase;
  }

  /* HISTORY */
  .history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--gris-borde);
    gap:10px;
  }
  .history-item:last-child{border-bottom:none;}
  .hist-left{display:flex;flex-direction:column;gap:2px;}
  .hist-day{font-size:13px;font-weight:700;color:var(--azul-oscuro);text-transform:capitalize;}
  .hist-date{font-size:11px;color:var(--gris-texto);}
  .hist-times{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--azul-medio);
    display:flex;
    gap:6px;
    align-items:center;
  }
  .hist-times .sep{color:var(--gris-texto);}
  .hist-times .pending{color:var(--rojo-egreso);font-style:italic;font-family:'Inter',sans-serif;font-size:11.5px;}
  .hist-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .hist-hours{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:700;
    color:var(--verde-ingreso-dark);
    background:#E7F4EE;
    padding:4px 9px;
    border-radius:8px;
    white-space:nowrap;
  }
  .sync-tag{
    font-size:10px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .sync-tag.synced{color:var(--verde-ingreso-dark);}
  .sync-tag.pending{color:var(--ambar);}
  .empty-state{
    text-align:center;
    padding:28px 10px;
    color:var(--gris-texto);
    font-size:13px;
  }
  .empty-state .icon{font-size:28px;display:block;margin-bottom:8px;}

  .footer-actions{
    text-align:center;
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
  }
  .footer-actions button{
    background:none;
    border:none;
    color:var(--gris-texto);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
  }
  .footer-actions button:hover{color:var(--rojo-egreso);}
  .footer-actions .sync-btn{
    text-decoration:none;
    color:var(--azul-claro);
    font-weight:600;
  }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--azul-oscuro);
    color:var(--blanco);
    padding:12px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    box-shadow:var(--shadow-lg);
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    z-index:100;
    white-space:nowrap;
    max-width:90vw;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast.success{background:var(--verde-ingreso-dark);}
  .toast.warning{background:var(--ambar);}
  .toast.error{background:var(--rojo-egreso-dark);}

  @media (max-width:360px){
    .clock{font-size:28px;}
    .summary-main .big{font-size:32px;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="conn-badge" id="connBadge">
      <span class="conn-dot"></span>
      <span id="connText">En línea</span>
    </div>
    <div class="eyebrow">Control de asistencia</div>
    <h1>Ingreso y Egreso</h1>
    <div class="clock" id="clock">00:00:00</div>
    <div class="clock-date" id="clockDate">-</div>
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Sin marcas registradas</span>
    </div>
  </header>

  <div class="estado-box" id="estadoBox">
    <span class="estado-emoji" id="estadoEmoji">🔴</span>
    <span id="estadoTexto">Estado actual: Fuera del trabajo</span>
  </div>

  <div class="punch-grid">
    <button class="punch-btn ingreso" id="btnIngreso">
      <span class="icon">&#8594;</span>
      <span class="label">INGRESO</span>
      <span class="sub" id="subIngreso">Marcar entrada</span>
    </button>
    <button class="punch-btn egreso" id="btnEgreso">
      <span class="icon">&#8592;</span>
      <span class="label">EGRESO</span>
      <span class="sub" id="subEgreso">Marcar salida</span>
    </button>
  </div>

  <div class="card">
    <h2>Resumen semanal</h2>
    <div class="card-sub" id="weekRangeLabel">-</div>
    <div class="summary-main">
      <span class="big" id="weekTotal">0:00</span>
      <span class="unit">horas trabajadas</span>
    </div>
    <div class="week-bars" id="weekBars"></div>
  </div>

  <div class="card">
    <h2>Historial de la semana</h2>
    <div class="card-sub">Día, entrada, salida, horas calculadas y estado de sincronización</div>
    <div id="historyList"></div>
  </div>

  <div class="footer-actions">
    <button class="sync-btn" id="btnForceSync">Reintentar sincronización pendiente</button>
    <button id="btnReset">Borrar todos los registros</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "control_ingreso_egreso_marcas_v2";
  // URL de tu Google Apps Script (Web App) desplegado con acceso "Cualquier usuario"
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwsI91SVLrgUkHX0VCIXGlo0SnWbtdJ88k5DuBEF3Q7qJxofwbJGeOVW8yrp5IpNGC9rw/exec";

  const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

  // ---------- Storage ----------
  // "marcas" es la lista plana y cronológica de cada click de Ingreso/Egreso.
  // Es la fuente de verdad para el estado actual (evita solapamientos).
  function loadMarcas(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Error leyendo localStorage", e);
      return [];
    }
  }
  function saveMarcas(marcas){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(marcas));
  }

  let marcas = loadMarcas();

  // ---------- Time helpers ----------
  function roundToNearest15(date){
    const d = new Date(date.getTime());
    const minutes = d.getMinutes();
    const remainder = minutes % 15;
    let roundedMinutes;
    if(remainder < 7.5){
      roundedMinutes = minutes - remainder;
    } else {
      roundedMinutes = minutes + (15 - remainder);
    }
    d.setMinutes(roundedMinutes);
    d.setSeconds(0);
    d.setMilliseconds(0);
    return d;
  }

  function fmtTime(date){
    if(!date) return "--:--";
    const d = new Date(date);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `${hh}:${mm}`;
  }

  function fmtTimeSec(date){
    const d = new Date(date);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    const ss = String(d.getSeconds()).padStart(2,"0");
    return `${hh}:${mm}:${ss}`;
  }

  function fmtDateShort(date){
    const d = new Date(date);
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  }

  function dateOnlyISO(date){
    const d = new Date(date);
    d.setHours(0,0,0,0);
    return d.toISOString().slice(0,10);
  }

  function hoursDecimal(entradaMs, salidaMs){
    if(!entradaMs || !salidaMs) return 0;
    const diff = salidaMs - entradaMs;
    return diff > 0 ? diff / (1000*60*60) : 0;
  }

  function fmtHoursMin(decimalHours){
    const totalMinutes = Math.round(decimalHours * 60);
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    return `${h}:${String(m).padStart(2,"0")}`;
  }

  // Monday-Sunday week range containing "date"
  function getWeekRange(date){
    const d = new Date(date);
    d.setHours(0,0,0,0);
    const day = d.getDay(); // 0 = domingo
    const diffToMonday = (day === 0) ? -6 : 1 - day;
    const monday = new Date(d);
    monday.setDate(d.getDate() + diffToMonday);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23,59,59,999);
    return { start: monday, end: sunday };
  }

  // ---------- Regla 1: Control de Estado (última marca del historial) ----------
  function getMarcasOrdenadas(){
    return [...marcas].sort((a,b) => new Date(a.raw) - new Date(b.raw));
  }

  function getUltimaMarca(){
    const ordenadas = getMarcasOrdenadas();
    return ordenadas.length > 0 ? ordenadas[ordenadas.length - 1] : null;
  }

  // "trabajando" | "fuera"
  function getEstadoActual(){
    const ultima = getUltimaMarca();
    if(!ultima || ultima.tipo === "Egreso") return "fuera";
    return "trabajando"; // ultima.tipo === "Ingreso"
  }

  // Reconstruye sesiones (entrada+salida) a partir de la lista de marcas,
  // solo para mostrar el resumen y el historial.
  function buildSesiones(){
    const ordenadas = getMarcasOrdenadas();
    const sesiones = [];
    let abierta = null;

    ordenadas.forEach(m => {
      if(m.tipo === "Ingreso"){
        if(abierta) sesiones.push(abierta); // por seguridad, si hubiera datos inconsistentes
        abierta = {
          id: m.id,
          dateISO: dateOnlyISO(m.raw),
          entradaRaw: m.raw,
          entradaRounded: m.rounded,
          entradaSynced: m.synced,
          salidaRaw: null,
          salidaRounded: null,
          salidaSynced: null
        };
      } else { // Egreso
        if(abierta){
          abierta.salidaRaw = m.raw;
          abierta.salidaRounded = m.rounded;
          abierta.salidaSynced = m.synced;
          sesiones.push(abierta);
          abierta = null;
        } else {
          sesiones.push({
            id: m.id,
            dateISO: dateOnlyISO(m.raw),
            entradaRaw: null,
            entradaRounded: null,
            entradaSynced: null,
            salidaRaw: m.raw,
            salidaRounded: m.rounded,
            salidaSynced: m.synced
          });
        }
      }
    });
    if(abierta) sesiones.push(abierta);
    return sesiones;
  }

  // ---------- Cloud sync (Google Sheets via Apps Script) ----------
  // Google Apps Script Web Apps no siempre responden con cabeceras CORS legibles,
  // así que usamos mode:'no-cors' y content-type 'text/plain' para evitar el preflight.
  function enviarAGoogleSheets(payload){
    return fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
  }

  function intentarSincronizar(marca){
    if(!navigator.onLine){
      showToast("Guardado localmente. Se sincronizará cuando haya conexión.", "warning");
      return;
    }

    // Los 4 datos originales solicitados: Fecha, Tipo, Hora Original, Hora Redondeada
    const payload = {
      id: marca.id,
      fecha: dateOnlyISO(marca.raw),
      tipo: marca.tipo,
      horaOriginal: fmtTimeSec(marca.raw),
      horaRedondeada: fmtTime(marca.rounded)
    };

    enviarAGoogleSheets(payload)
      .then(() => {
        marca.synced = true;
        saveMarcas(marcas);
        render();
        showToast("Sincronizado con la nube ☁️", "success");
      })
      .catch((err) => {
        console.error("Error de sincronización:", err);
        marca.synced = false;
        saveMarcas(marcas);
        render();
        showToast("Sin conexión. Se guardó local y se sincronizará luego.", "warning");
      });
  }

  function reintentarPendientes(silencioso){
    if(!navigator.onLine) return;
    const pendientes = marcas.filter(m => !m.synced);
    if(pendientes.length === 0){
      if(!silencioso) showToast("No hay registros pendientes de sincronizar.", "success");
      return;
    }
    if(!silencioso) showToast(`Sincronizando ${pendientes.length} registro(s) pendiente(s)...`, "warning");
    pendientes.forEach(m => intentarSincronizar(m));
  }

  // ---------- Regla 2: acciones de marcado con bloqueo inteligente ----------
  function marcarIngreso(){
    if(getEstadoActual() !== "fuera"){
      showToast("Ya estás marcado como Trabajando. Marcá tu Egreso primero.", "warning");
      return;
    }
    const now = new Date();
    const rounded = roundToNearest15(now);
    const marca = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      tipo: "Ingreso",
      raw: now.toISOString(),
      rounded: rounded.toISOString(),
      synced: false
    };

    // Guardado local inmediato
    marcas.push(marca);
    saveMarcas(marcas);
    render();
    showToast(`Ingreso registrado a las ${fmtTime(rounded)}`, "success");

    // Envío en segundo plano
    intentarSincronizar(marca);
  }

  function marcarEgreso(){
    if(getEstadoActual() !== "trabajando"){
      showToast("No hay un Ingreso activo. Marcá tu Ingreso primero.", "warning");
      return;
    }
    const now = new Date();
    const rounded = roundToNearest15(now);
    const marca = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      tipo: "Egreso",
      raw: now.toISOString(),
      rounded: rounded.toISOString(),
      synced: false
    };

    // Guardado local inmediato
    marcas.push(marca);
    saveMarcas(marcas);
    render();
    showToast(`Egreso registrado a las ${fmtTime(rounded)}`, "success");

    // Envío en segundo plano
    intentarSincronizar(marca);
  }

  function resetAll(){
    if(!confirm("¿Seguro que deseas borrar todos los registros guardados localmente? Esta acción no se puede deshacer (no borra la hoja de cálculo).")) return;
    marcas = [];
    saveMarcas(marcas);
    render();
    showToast("Registros locales eliminados", "success");
  }

  // ---------- Rendering ----------
  function renderConnBadge(){
    const badge = document.getElementById("connBadge");
    const text = document.getElementById("connText");
    if(navigator.onLine){
      badge.classList.remove("offline");
      text.textContent = "En línea";
    } else {
      badge.classList.add("offline");
      text.textContent = "Sin conexión";
    }
  }

  // Regla 3: indicador de estado visual grande
  function renderEstadoBox(){
    const estado = getEstadoActual();
    const box = document.getElementById("estadoBox");
    const emoji = document.getElementById("estadoEmoji");
    const texto = document.getElementById("estadoTexto");

    if(estado === "trabajando"){
      box.className = "estado-box trabajando";
      emoji.textContent = "🟢";
      texto.textContent = "Estado actual: Trabajando";
    } else {
      box.className = "estado-box fuera";
      emoji.textContent = "🔴";
      texto.textContent = "Estado actual: Fuera del trabajo";
    }
  }

  // Regla 2: bloqueo inteligente de botones
  function renderBotones(){
    const estado = getEstadoActual();
    const btnIngreso = document.getElementById("btnIngreso");
    const btnEgreso = document.getElementById("btnEgreso");
    const subIngreso = document.getElementById("subIngreso");
    const subEgreso = document.getElementById("subEgreso");

    if(estado === "fuera"){
      btnIngreso.disabled = false;
      btnEgreso.disabled = true;
      subIngreso.textContent = "Marcar entrada";
      subEgreso.textContent = "Bloqueado";
    } else {
      btnIngreso.disabled = true;
      btnEgreso.disabled = false;
      subIngreso.textContent = "Bloqueado";
      subEgreso.textContent = "Marcar salida";
    }
  }

  function renderStatusRow(){
    const ultima = getUltimaMarca();
    const dot = document.getElementById("statusDot");
    const text = document.getElementById("statusText");

    if(!ultima){
      dot.classList.remove("active");
      text.textContent = "Sin marcas registradas";
      return;
    }
    if(ultima.tipo === "Ingreso"){
      dot.classList.add("active");
      text.textContent = `Ingresaste a las ${fmtTime(ultima.rounded)}`;
    } else {
      dot.classList.remove("active");
      text.textContent = `Última salida: ${fmtTime(ultima.rounded)}`;
    }
  }

  function renderWeekSummary(){
    const { start, end } = getWeekRange(new Date());
    const sesiones = buildSesiones();
    const weekSesiones = sesiones.filter(s => {
      const ref = s.entradaRaw || s.salidaRaw;
      const rd = new Date(ref);
      return rd >= start && rd <= end;
    });

    document.getElementById("weekRangeLabel").textContent =
      `${fmtDateShort(start)} — ${fmtDateShort(end)}`;

    let totalHours = 0;
    const perDay = [0,0,0,0,0,0,0]; // index 0=lunes ... 6=domingo

    weekSesiones.forEach(s => {
      if(s.entradaRounded && s.salidaRounded){
        const h = hoursDecimal(new Date(s.entradaRounded).getTime(), new Date(s.salidaRounded).getTime());
        totalHours += h;
        const ref = s.entradaRaw || s.salidaRaw;
        const jsDay = new Date(ref).getDay(); // 0=domingo
        const idx = (jsDay === 0) ? 6 : jsDay - 1;
        perDay[idx] += h;
      }
    });

    document.getElementById("weekTotal").textContent = fmtHoursMin(totalHours);

    const maxH = Math.max(...perDay, 1);
    const barsContainer = document.getElementById("weekBars");
    barsContainer.innerHTML = "";
    const labels = ["L","M","X","J","V","S","D"];
    const todayIdx = (function(){
      const jsDay = new Date().getDay();
      return (jsDay === 0) ? 6 : jsDay - 1;
    })();

    perDay.forEach((h, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "day-bar-wrap";
      const bar = document.createElement("div");
      const heightPct = h > 0 ? Math.max(8, (h / maxH) * 100) : 4;
      bar.style.height = heightPct + "%";
      bar.className = "day-bar" + (h > 0 ? " has-hours" : "") + (idx === todayIdx ? " today" : "");
      const label = document.createElement("div");
      label.className = "day-label";
      label.textContent = labels[idx];
      wrap.appendChild(bar);
      wrap.appendChild(label);
      barsContainer.appendChild(wrap);
    });
  }

  function renderHistory(){
    const { start, end } = getWeekRange(new Date());
    const sesiones = buildSesiones();
    const weekSesiones = sesiones
      .filter(s => {
        const ref = s.entradaRaw || s.salidaRaw;
        const rd = new Date(ref);
        return rd >= start && rd <= end;
      })
      .sort((a,b) => new Date(b.entradaRaw || b.salidaRaw) - new Date(a.entradaRaw || a.salidaRaw));

    const container = document.getElementById("historyList");
    container.innerHTML = "";

    if(weekSesiones.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <span class="icon">&#128203;</span>
          Todavía no hay registros esta semana.<br>Marcá tu ingreso para comenzar.
        </div>`;
      return;
    }

    weekSesiones.forEach(s => {
      const ref = s.entradaRaw || s.salidaRaw;
      const refDate = new Date(ref);
      const dayName = DIAS[refDate.getDay()];
      const item = document.createElement("div");
      item.className = "history-item";

      const entradaHtml = s.entradaRounded
        ? `<span>${fmtTime(s.entradaRounded)}</span>`
        : `<span class="pending">sin ingreso</span>`;
      const salidaHtml = s.salidaRounded
        ? `<span>${fmtTime(s.salidaRounded)}</span>`
        : `<span class="pending">en curso</span>`;

      const horasHtml = (s.entradaRounded && s.salidaRounded)
        ? fmtHoursMin(hoursDecimal(new Date(s.entradaRounded).getTime(), new Date(s.salidaRounded).getTime()))
        : "—";

      const entradaOk = s.entradaRounded ? !!s.entradaSynced : true;
      const salidaOk = s.salidaRounded ? !!s.salidaSynced : true;
      const totalmenteSincronizado = entradaOk && salidaOk;
      const syncHtml = totalmenteSincronizado
        ? `<span class="sync-tag synced">☁️ Sincronizado</span>`
        : `<span class="sync-tag pending">⏳ Pendiente</span>`;

      item.innerHTML = `
        <div class="hist-left">
          <span class="hist-day">${dayName}</span>
          <span class="hist-date">${fmtDateShort(refDate)}</span>
          <span class="hist-times">
            ${entradaHtml}
            <span class="sep">→</span>
            ${salidaHtml}
          </span>
        </div>
        <div class="hist-right">
          <div class="hist-hours">${horasHtml}</div>
          ${syncHtml}
        </div>
      `;
      container.appendChild(item);
    });
  }

  function render(){
    renderConnBadge();
    renderEstadoBox();
    renderBotones();
    renderStatusRow();
    renderWeekSummary();
    renderHistory();
  }

  // ---------- Clock ----------
  function tickClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,"0");
    const mm = String(now.getMinutes()).padStart(2,"0");
    const ss = String(now.getSeconds()).padStart(2,"0");
    document.getElementById("clock").textContent = `${hh}:${mm}:${ss}`;

    const dayName = DIAS[now.getDay()];
    const dateStr = `${dayName}, ${now.getDate()} de ${now.toLocaleString('es-ES', { month: 'long' })}`;
    document.getElementById("clockDate").textContent = dateStr;
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function showToast(msg, type){
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.className = "toast show" + (type ? (" " + type) : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
  }

  // ---------- Init ----------
  document.getElementById("btnIngreso").addEventListener("click", marcarIngreso);
  document.getElementById("btnEgreso").addEventListener("click", marcarEgreso);
  document.getElementById("btnReset").addEventListener("click", resetAll);
  document.getElementById("btnForceSync").addEventListener("click", () => reintentarPendientes(false));

  window.addEventListener("online", () => {
    render();
    showToast("Conexión recuperada. Sincronizando pendientes...", "warning");
    reintentarPendientes(true);
  });
  window.addEventListener("offline", () => {
    render();
    showToast("Sin conexión a internet. Los registros se guardan localmente.", "warning");
  });

  tickClock();
  setInterval(tickClock, 1000);
  render();

  // Reintenta sincronizar pendientes al abrir la app (por si quedaron sin enviar)
  reintentarPendientes(true);

  // Reintento periódico silencioso cada 60s + refresco de vista semanal
  setInterval(() => {
    render();
    reintentarPendientes(true);
  }, 60000);

})();
</script>
</body>
</html>
